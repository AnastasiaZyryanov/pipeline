[project]
name = "pipeline"
version = "0.1.0"
description = "Pipeline library"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "jsonschema>=4.26.0",
    "keybert>=0.9.0",
    "magicmock>=0.3",
    "nltk>=3.9.2",
    "numpy<2.4",
    "ollama>=0.6.2",
    "openai>=2.16.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "scikit-learn>=1.8.0",
    "sentence-transformers>=5.4.1",
    "torch==2.9.1",
    "transformers==4.56.1",
    "vllm==0.14.1; sys_platform == 'linux'",
    "tokenspeed-mla>=0.1.2; sys_platform == 'linux'",
    "huggingface-hub>=0.20.0",
    "streamlit>=1.58.0",
]
[tool.uv]
package = true


[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
